[workspace]
resolver = "3"
members = ["crates/bragi", "crates/k100", "crates/engine", "crates/audio", "crates/actions", "crates/ipc", "crates/install", "crates/daemon", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Garulf/corsair-keyboard"

[workspace.dependencies]
bragi = { path = "crates/bragi" }
k100 = { path = "crates/k100" }
engine = { path = "crates/engine" }
audio = { path = "crates/audio" }
realfft = "3.5"
actions = { path = "crates/actions" }
ipc = { path = "crates/ipc" }
install = { path = "crates/install" }
winreg = "0.56"
daemon = { path = "crates/daemon" }
gui = { path = "crates/gui" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_kittest = "0.37"
interprocess = "2.4"
serde_json = "1.0"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
directories = "6"
notify = "8.2"
evdev = "0.13"
windows-sys = "0.61"
tray-icon = { version = "0.26", default-features = false }
gtk = "0.18"
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
hidapi = { version = "2.6", default-features = false }
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
