[workspace]
resolver = "3"
members = ["crates/bragi", "crates/k100", "crates/engine", "crates/ipc", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/Garulf/corsair-keyboard"

[workspace.dependencies]
bragi = { path = "crates/bragi" }
k100 = { path = "crates/k100" }
engine = { path = "crates/engine" }
ipc = { path = "crates/ipc" }
daemon = { path = "crates/daemon" }
interprocess = "2.4"
serde_json = "1.0"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
directories = "6"
notify = "8.2"
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
hidapi = { version = "2.6", default-features = false }
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
