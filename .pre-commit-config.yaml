repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/Garulf/readwright
    rev: v0.5.0
    hooks:
      - id: readwright-check
        stages: [pre-push]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]
      - id: cargo-test
        name: cargo clippy and test
        entry: bash -c 'cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace'
        language: system
        pass_filenames: false
        stages: [pre-push]
