[package]
name = "k100-cli"
description = "Command-line control for the Corsair K100"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "k100"
path = "src/main.rs"

[dependencies]
actions.workspace = true
audio.workspace = true
bragi.workspace = true
k100.workspace = true
clap.workspace = true
daemon.workspace = true
ctrlc.workspace = true
engine.workspace = true
gui.workspace = true
install.workspace = true
ipc.workspace = true
onboard.workspace = true
sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile.workspace = true
