[package]
name = "daemon"
description = "Background service that owns the Corsair K100"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "k100d"
path = "src/main.rs"

[features]
tray = ["dep:tray-icon", "dep:gtk"]

[dependencies]
actions.workspace = true
audio.workspace = true
bragi.workspace = true
k100.workspace = true
engine.workspace = true
install.workspace = true
ipc.workspace = true
onboard.workspace = true
sdk.workspace = true
interprocess.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sysinfo.workspace = true
directories.workspace = true
notify.workspace = true
ctrlc.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon.workspace = true

[target.'cfg(not(windows))'.dependencies]
tray-icon = { workspace = true, optional = true, features = ["libappindicator"] }
gtk = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
